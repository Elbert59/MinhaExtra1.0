<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Minha Extra - Chat Empresa & Freelancer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        (function() {
            try {
                const saved = localStorage.getItem('minha_extra_theme');
                if (saved === 'dark' || (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            } catch(e) {}
        })();
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        primary: '#4f46e5', // Indigo 600
                        primaryHover: '#4338ca', // Indigo 700
                        primaryLight: '#e0e7ff',
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        @supports (padding-bottom: env(safe-area-inset-bottom)) {
            .pb-safe { padding-bottom: calc(0.75rem + env(safe-area-inset-bottom)); }
        }

        .message-enter {
            animation: slideUpFade 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .typing-dot {
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
    </style>
</head>

            if (!user) return;
            
            // Prioridade de segurança: perfil autenticado na sessão ativa do usuário (inviolável)
            isEmpresaMode = (user.tipo_perfil === 'empresa');
            const isDemo = !!user.isDemo;
            
            const params = new URLSearchParams(window.location.search);
            const targetFreeId = params.get('freelancer_id');
            const targetEmpId = params.get('empresa_id');
            const targetNome = params.get('nome');

            // Atualiza UI com o perfil correto e navegação correspondente
            setupUserRoleUI();

            // Configura a lista de contatos: contas demo usam lista modelo; contas reais começam vazias
            if (isEmpresaMode) {
                // Modo EMPRESA
                contatosAtuais = isDemo ? [...CONTATOS_FREELANCERS_BASE] : [];
                if (targetFreeId) {
                    const found = contatosAtuais.find(c => String(c.id) === String(targetFreeId));
                    if (found) {
                        currentActiveContact = found;
                    } else {
                        const novo = {
                            id: parseInt(targetFreeId, 10),
                            tipo: 'freelancer',
                            nome: targetNome || 'Profissional Freelancer',
                            sub: 'Candidatura no Minha Extra',
                            avatar: `https://ui-avatars.com/api/?name=${encodeURIComponent(targetNome || 'F')}&background=4f46e5&color=fff`
                        };
                        contatosAtuais.unshift(novo);
                        currentActiveContact = novo;
                    }
                } else {
                    currentActiveContact = contatosAtuais[0] || null;
                }
            } else {
                // Modo FREELANCER
                contatosAtuais = isDemo ? [...CONTATOS_EMPRESAS_BASE] : [];
                if (targetEmpId) {
                    const found = contatosAtuais.find(c => String(c.id) === String(targetEmpId));
                    if (found) {
                        currentActiveContact = found;
                    } else {
                        const novaEmp = {
                            id: parseInt(targetEmpId, 10),
                            tipo: 'empresa',
                            nome: targetNome || 'Empresa Contratante',
                            sub: 'Contratante no Minha Extra',
                            avatar: `https://ui-avatars.com/api/?name=${encodeURIComponent(targetNome || 'E')}&background=1e293b&color=fff`
                        };
                        contatosAtuais.unshift(novaEmp);
                        currentActiveContact = novaEmp;
                    }
                } else {
                    currentActiveContact = contatosAtuais[0] || null;
                }
            }

            renderContactsList();
            renderActiveConversation();
            renderQuickChips();
        }

        function setupUserRoleUI() {
            const user = window.MinhaExtra.SessionManager.getUser();
            const label = document.getElementById('current-user-role-label');
            const backBtn = document.getElementById('btn-back-dashboard');
            const contactsTitle = document.getElementById('contacts-list-title');
            const contactsBadge = document.getElementById('contacts-badge');
            const navEmpresa = document.getElementById('empresa-bottom-nav');
            const navFreelancer = document.getElementById('freelancer-bottom-nav');
            const badgeContainer = document.getElementById('user-identity-badge');
            const roleIcon = document.getElementById('user-role-icon');
            const sessionType = document.getElementById('user-session-type');
            const msgInput = document.getElementById('message-input');

            if (isEmpresaMode) {
                const empNome = (user && user.razao_social) ? user.razao_social : 'Restaurante Sabor do Mar';
                if (label) label.innerText = empNome;
                if (roleIcon) roleIcon.innerText = '🏢';
                if (sessionType) sessionType.innerText = 'Empresa Autenticada';
                if (badgeContainer) {
                    badgeContainer.className = 'flex items-center gap-2 px-3 py-1.5 bg-indigo-50/90 border border-indigo-200 rounded-xl shadow-2xs text-indigo-950';
                }
                if (backBtn) backBtn.href = 'dashboard-empresa.html';
                if (contactsTitle) contactsTitle.innerText = 'Candidatos & Freelancers';
                if (contactsBadge) contactsBadge.innerText = `${CONTATOS_FREELANCERS_BASE.length} Profissionais`;
                if (msgInput) msgInput.placeholder = 'Mensagem para o candidato...';

                // Exibe estritamente a barra de navegação da empresa
                if (navEmpresa) {
                    navEmpresa.classList.remove('hidden');
                    navEmpresa.classList.add('flex');
                }
                if (navFreelancer) {
                    navFreelancer.classList.add('hidden');
                    navFreelancer.classList.remove('flex');
                }
            } else {
                const freeNome = (user && user.nome_completo) ? user.nome_completo : 'Elbert Figueiredo';
                if (label) label.innerText = freeNome;
                if (roleIcon) roleIcon.innerText = '👨‍🍳';
                if (sessionType) sessionType.innerText = 'Freelancer Autenticado';
                if (badgeContainer) {
                    badgeContainer.className = 'flex items-center gap-2 px-3 py-1.5 bg-emerald-50/90 border border-emerald-200 rounded-xl shadow-2xs text-emerald-950';
                }
                if (backBtn) backBtn.href = 'dashboard.html';
                if (contactsTitle) contactsTitle.innerText = 'Empresas & Contratantes';
                if (contactsBadge) contactsBadge.innerText = `${CONTATOS_EMPRESAS_BASE.length} Empresas`;
                if (msgInput) msgInput.placeholder = 'Mensagem para a empresa contratante...';

                // Exibe estritamente a barra de navegação do freelancer (Início, Carteira, Chat, Perfil)
                if (navFreelancer) {
                    navFreelancer.classList.remove('hidden');
                    navFreelancer.classList.add('flex');
                }
                if (navEmpresa) {
                    navEmpresa.classList.add('hidden');
                    navEmpresa.classList.remove('flex');
                }
            }
        }

        function getCanonicalEmpresaId() {
            const user = window.MinhaExtra.SessionManager.getUser() || {};
            if (isEmpresaMode) {
                return (user.empresa_id && user.empresa_id !== 1 && user.empresa_id !== 5) ? user.empresa_id : 2;
            }
            return (currentActiveContact && currentActiveContact.tipo === 'empresa') ? currentActiveContact.id : 2;
        }

        function getCanonicalFreelancerId() {
            const user = window.MinhaExtra.SessionManager.getUser() || {};
            if (!isEmpresaMode) {
                return (user.freelancer_id && user.freelancer_id !== 1 && user.freelancer_id !== 6) ? user.freelancer_id : 7;
            }
            return (currentActiveContact && currentActiveContact.tipo === 'freelancer') ? currentActiveContact.id : 7;
        }

        function getConversationKey() {
            const empId = getCanonicalEmpresaId();
            const freeId = getCanonicalFreelancerId();
            return `chat_empresa_${empId}_free_${freeId}`;
        }

        function getStoredMessages(convKey, targetContact) {
            try {
                const store = JSON.parse(localStorage.getItem('minha_extra_chat_store') || '{}');
                if (store && store[convKey] && Array.isArray(store[convKey]) && store[convKey].length > 0) {
                    return store[convKey];
                }
            } catch(e) {}

            const user = window.MinhaExtra.SessionManager.getUser() || {};
            // Mensagens modelo apenas para contas de teste/demo
            if (user.isDemo) {
                if (DEFAULT_CONVERSATIONS[convKey]) {
                    return DEFAULT_CONVERSATIONS[convKey];
                }
                const contactObj = targetContact || currentActiveContact;
                const contactName = contactObj ? contactObj.nome : (isEmpresaMode ? 'Profissional' : 'Empresa');
                if (isEmpresaMode) {
                    return [
                        { senderType: 'empresa', senderName: 'Restaurante Sabor do Mar', text: `Olá ${contactName}! Vimos sua disponibilidade registrada no Minha Extra.`, time: '10:00' },
                        { senderType: 'freelancer', senderName: contactName, text: 'Olá! Sim, tenho total disponibilidade para o turno.', time: '10:02' }
                    ];
                } else {
                    return [
                        { senderType: 'empresa', senderName: contactName, text: 'Olá! Conectamos você ao nosso estabelecimento no Minha Extra.', time: '10:00' },
                        { senderType: 'freelancer', senderName: 'Elbert Figueiredo', text: 'Olá! Tenho interesse nas oportunidades divulgadas por vocês.', time: '10:02' }
                    ];
                }
            }

            return [];
        }

        function saveMessage(convKey, msgObj) {
            const store = JSON.parse(localStorage.getItem('minha_extra_chat_store') || '{}');
            const list = store[convKey] || [];
            list.push(msgObj);
            store[convKey] = list;
            localStorage.setItem('minha_extra_chat_store', JSON.stringify(store));
        }

        function renderContactsList() {
            const container = document.getElementById('contacts-container');
            if (!container) return;
            container.innerHTML = '';

            if (contatosAtuais.length === 0) {
                container.innerHTML = `
                    <div class="p-8 text-center text-slate-400">
                        <div class="w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center mx-auto mb-2 text-slate-400">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
                        </div>
                        <p class="text-xs font-bold text-slate-700 mb-1">Nenhuma conversa recente</p>
                        <p class="text-[11px] text-slate-500">Inicie um bate-papo a partir das vagas ou candidaturas.</p>
                    </div>
                `;
                return;
            }

            contatosAtuais.forEach(contato => {
                const isSelected = currentActiveContact && currentActiveContact.id === contato.id;
                
                let empId, freeId;
                if (isEmpresaMode) {
                    empId = getCanonicalEmpresaId();
                    freeId = contato.id;
                } else {
                    empId = contato.id;
                    freeId = getCanonicalFreelancerId();
                }
                const convKey = `chat_empresa_${empId}_free_${freeId}`;

                const msgs = getStoredMessages(convKey, contato);
                const lastMsg = msgs.length > 0 ? msgs[msgs.length - 1].text : 'Iniciar conversa...';

                const item = document.createElement('div');
                item.className = `p-3 flex items-center space-x-3 cursor-pointer transition-colors ${isSelected ? (isEmpresaMode ? 'bg-indigo-50/70 border-r-4 border-primary' : 'bg-emerald-50/70 border-r-4 border-emerald-600') : 'hover:bg-slate-50'}`;
                item.onclick = () => selectContact(contato);
                item.innerHTML = `
                    <div class="relative shrink-0">
                        <img src="${contato.avatar}" class="w-10 h-10 rounded-full border border-slate-100 object-cover shadow-xs" alt="avatar">
                        <span class="w-2.5 h-2.5 bg-emerald-500 border-2 border-white rounded-full absolute bottom-0 right-0"></span>
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="flex justify-between items-baseline mb-0.5">
                            <h3 class="text-xs font-bold text-slate-900 truncate">${escapeHtml(contato.nome)}</h3>
                            <span class="text-[10px] text-slate-400">Agora</span>
                        </div>
                        <p class="text-[11px] text-slate-500 truncate">${escapeHtml(lastMsg)}</p>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        function selectContact(contato) {
            currentActiveContact = contato;
            renderContactsList();
            renderActiveConversation();
            
            // Em telas móveis, foca a conversa aberta
            if (window.innerWidth < 640) {
                document.getElementById('chat-sidebar').classList.add('hidden');
                document.getElementById('chat-main').classList.remove('hidden');
            }
        }

        function backToContactsMobile() {
            document.getElementById('chat-sidebar').classList.remove('hidden');
            document.getElementById('chat-main').classList.add('hidden');
        }

        function renderActiveConversation() {
            if (!currentActiveContact) return;

            const nameEl = document.getElementById('active-contact-name');
            const subEl = document.getElementById('active-contact-sub');
            const avatarEl = document.getElementById('active-contact-avatar');

            const roleBadge = isEmpresaMode 
                ? '<span class="ml-2 px-2 py-0.5 bg-indigo-50 text-indigo-700 text-[10px] font-bold rounded-full border border-indigo-200">Candidato</span>' 
                : '<span class="ml-2 px-2 py-0.5 bg-amber-50 text-amber-800 text-[10px] font-bold rounded-full border border-amber-200">Contratante</span>';

            if (nameEl) nameEl.innerHTML = `${escapeHtml(currentActiveContact.nome)} ${roleBadge}`;
            if (subEl) subEl.innerHTML = `${escapeHtml(currentActiveContact.sub)} • <span class="text-emerald-600 font-semibold">Online</span>`;
            if (avatarEl) avatarEl.src = currentActiveContact.avatar;

            const container = document.getElementById('messages-container');
            if (container) {
                container.innerHTML = `
                    <div class="flex justify-center mb-3">
                        <div class="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-full text-[11px] font-bold ${isEmpresaMode ? 'bg-indigo-50 text-indigo-800 border border-indigo-200' : 'bg-emerald-50 text-emerald-800 border border-emerald-200'} shadow-2xs">
                            <span>${isEmpresaMode ? '🏢 Chat da Empresa:' : '👨‍🍳 Chat do Freelancer:'}</span>
                            <span class="font-medium">${isEmpresaMode ? 'Conversando com o candidato. Suas mensagens aparecem à direita.' : 'Conversando com a empresa contratante. Suas mensagens aparecem à direita.'}</span>
                        </div>
                    </div>
                `;

                const convKey = getConversationKey();
                const messages = getStoredMessages(convKey);

                messages.forEach(msg => {
                    appendMessageBubble(msg, false);
                });

                container.scrollTop = container.scrollHeight;
            }
        }

        function appendMessageBubble(msg, animate = true) {
            const container = document.getElementById('messages-container');
            if (!container) return;

            const isMe = (isEmpresaMode && msg.senderType === 'empresa') || (!isEmpresaMode && msg.senderType === 'freelancer');

            const wrapper = document.createElement('div');
            wrapper.className = `flex flex-col space-y-1 ${isMe ? 'items-end' : 'items-start'} ${animate ? 'message-enter' : ''}`;

            const bubbleColor = isMe 
                ? (isEmpresaMode 
                    ? 'bg-primary text-white rounded-2xl rounded-tr-xs shadow-sm shadow-indigo-200' 
                    : 'bg-emerald-600 text-white rounded-2xl rounded-tr-xs shadow-sm shadow-emerald-200')
                : 'bg-white border border-slate-200 text-slate-800 rounded-2xl rounded-tl-xs shadow-xs';

            const senderLabel = isMe 
                ? (isEmpresaMode ? 'Você (Empresa)' : 'Você (Freelancer)') 
                : (escapeHtml(msg.senderName) + (msg.senderType === 'empresa' ? ' (Empresa)' : ' (Freelancer)'));

            wrapper.innerHTML = `
                <span class="text-[9px] text-slate-400 font-semibold px-1">${senderLabel}</span>
                <div class="${bubbleColor} px-4 py-2.5 max-w-[85%] sm:max-w-[70%]">
                    <p class="text-xs sm:text-sm leading-relaxed">${escapeHtml(msg.text)}</p>
                </div>
                <div class="flex items-center text-[10px] text-slate-400 px-1">
                    <span>${escapeHtml(msg.time || 'Agora')}</span>
                    ${isMe ? '<svg class="w-3 h-3 text-white/80 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>' : ''}
                </div>
            `;

            container.appendChild(wrapper);
            container.scrollTop = container.scrollHeight;
        }

        function handleSendMessage(event) {
            if (event) event.preventDefault();

            // Proteção contra spam de mensagens (Rate Limiting: máx 8 mensagens por 10 segundos)
            const rateCheck = window.MinhaExtra.RateLimiter.verificar('chat_send', 8, 10000);
            if (!rateCheck.permitido) {
                alert('Aguarde alguns segundos antes de enviar outra mensagem por motivos de segurança.');
                return;
            }

            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (!text) return;

            input.value = '';
            const now = new Date();
            const timeStr = now.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });

            const user = window.MinhaExtra.SessionManager.getUser() || {};
            const myType = isEmpresaMode ? 'empresa' : 'freelancer';
            const myName = isEmpresaMode 
                ? (user.razao_social || 'Restaurante Sabor do Mar')
                : (user.nome_completo || 'Elbert Figueiredo');

            const msgObj = {
                senderType: myType,
                senderName: myName,
                text: text,
                time: timeStr
            };

            const convKey = getConversationKey();
            saveMessage(convKey, msgObj);
            appendMessageBubble(msgObj, true);
            renderContactsList();

            input.focus();
        }

        function renderQuickChips() {
            const container = document.getElementById('quick-chips-container');
            if (!container) return;
            container.innerHTML = '';

            const chips = isEmpresaMode ? [
                'Você tem disponibilidade para este sábado?',
                'Qual o seu valor de diária para o evento?',
                'Precisa de uniforme ou possui dólmã própria?',
                'Candidatura confirmada! Te aguardamos às 18h.'
            ] : [
                'Olá! Tenho total disponibilidade para a vaga.',
                'Tenho conjunto de facas e uniforme próprios.',
                'Perfeito! Estarei presente no horário combinado.',
                'Chave PIX enviada para confirmação.'
            ];

            chips.forEach(chipText => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = `px-2.5 py-1 text-slate-600 rounded-lg text-xs font-medium whitespace-nowrap transition-colors border border-slate-200 cursor-pointer ${isEmpresaMode ? 'bg-slate-100 hover:bg-indigo-50 hover:text-indigo-700' : 'bg-slate-100 hover:bg-emerald-50 hover:text-emerald-700'}`;
                btn.innerText = chipText;
                btn.onclick = () => {
                    document.getElementById('message-input').value = chipText;
                    handleSendMessage();
                };
                container.appendChild(btn);
            });
        }

        // Simula resposta da outra ponta no chat
        function simulateReply() {
            const indicator = document.getElementById('typing-indicator');
            const typingName = document.getElementById('typing-name');
            const otherName = currentActiveContact ? currentActiveContact.nome : 'Contato';
            if (typingName) typingName.innerText = `${otherName} está digitando`;
            if (indicator) indicator.classList.remove('hidden');

            const container = document.getElementById('messages-container');
            if (container) container.scrollTop = container.scrollHeight;

            const repliesEmpresa = [
                'Perfeito! Confirmamos a sua presença para a oportunidade.',
                'Você receberá o pagamento da diária via PIX logo após o turno.',
                'O restaurante fica localizado na Av. Brasil, centro de Maringá.',
                'Combinado! Qualquer dúvida pode nos chamar por aqui.'
            ];

            const repliesFreelancer = [
                'Combinado! Chegarei com 15 minutos de antecedência.',
                'Pode deixar, levarei meu material de trabalho completo.',
                'Obrigado pela oportunidade! Até logo.',
                'Confirmadíssimo! Até o início do turno.'
            ];

            const replyPool = isEmpresaMode ? repliesFreelancer : repliesEmpresa;
            const chosenText = replyPool[Math.floor(Math.random() * replyPool.length)];

            setTimeout(() => {
                if (indicator) indicator.classList.add('hidden');
                const now = new Date();
                const timeStr = now.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });

                const otherType = isEmpresaMode ? 'freelancer' : 'empresa';
                const msgObj = {
                    senderType: otherType,
                    senderName: otherName,
                    text: chosenText,
                    time: timeStr
                };

                const convKey = getConversationKey();
                saveMessage(convKey, msgObj);
                appendMessageBubble(msgObj, true);
                renderContactsList();
            }, 1000);
        }

        function filterContacts() {
            const query = (document.getElementById('contact-search').value || '').toLowerCase();
            const items = document.querySelectorAll('#contacts-container > div');
            items.forEach(item => {
                const text = item.innerText.toLowerCase();
                item.style.display = text.includes(query) ? 'flex' : 'none';
            });
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
            });
        }
    </script>
</body>
</html>
